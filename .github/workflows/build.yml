name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyectos
        run: |
          mkdir work
          for z in *.zip; do unzip -q "$z" -d work; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Compilar todos los mods
        run: |
          for d in work/*/; do
            echo "=== Compilando $d ==="
            gradle -p "$d" build
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mods
          path: |
            work/*/build/libs/*.jar
            !work/*/build/libs/*-sources.jar

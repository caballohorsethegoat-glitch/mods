name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyectos
        run: |
          mkdir work
          unzip -q ./*.zip -d work
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Compilar Creeper Pastel
        run: gradle -p work/creeper-pastel build
      - name: Compilar Dron
        run: gradle -p work/dron build
      - uses: actions/upload-artifact@v4
        with:
          name: creeper-pastel-mod
          path: work/creeper-pastel/build/libs/creeper-pastel-1.0.0.jar
      - uses: actions/upload-artifact@v4
        with:
          name: dron-mod
          path: work/dron/build/libs/dron-mod-1.0.0.jar
